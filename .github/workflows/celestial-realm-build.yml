name: Build Celestial Realm 1.21.11

on:
  push:
    branches:
      - celestial-realm-1.21.11-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: celestial-realm-1.21.11
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: celestial-realm-1.21.11
          path: celestial-realm-1.21.11/build/libs/*.jar
          if-no-files-found: error
