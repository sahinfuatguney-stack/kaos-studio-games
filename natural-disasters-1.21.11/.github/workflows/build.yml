name: Build Natural Disasters JAR

on:
  push:
    branches: [ natural-disasters-1.21.11 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build JAR
        working-directory: natural-disasters-1.21.11
        run: gradle build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Natural-Disasters-1.21.11
          path: natural-disasters-1.21.11/build/libs/*.jar
          if-no-files-found: error
